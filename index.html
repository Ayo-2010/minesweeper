<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="game">
  <header>
    <h1>Minesweeper</h1>
    <p>9 × 9 board · 10 mines</p>
  </header>

  <div class="hud">
    <div class="chip"><span id="mineCount">10</span><small>mines</small></div>
    <button class="face" id="resetBtn" type="button" aria-label="Restart game">🙂</button>
    <div class="chip"><span id="time">0</span><small>seconds</small></div>
  </div>

  <div class="board" id="board"></div>

  <p class="hint" id="hint">Left click to reveal. Right click to flag.</p>
</main>
<script src="script.js"></script>
</body>
</html>
